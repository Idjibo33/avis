name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Flutter 3.50 rend `material.dart` obsolète : les 63 infos ne doivent pas
      # faire échouer la CI ; le backend est analysé avec son propre workspace.
      - run: flutter analyze --no-fatal-infos
      - name: Analyse du backend Serverpod
        working-directory: serverpod
        run: |
          dart pub get
          dart analyze
      - run: flutter test
      - run: flutter build web --release
