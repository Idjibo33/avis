services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: avis
      POSTGRES_PASSWORD: "YHNE1_F6LVB4CgzaAMSB1_MXWSn8rRUw"
    volumes:
      - avis_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "eQenbwPj2xi7HlJbOqMpfGLGgORcPtt1"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: avis_test
      POSTGRES_PASSWORD: "xxkxErDZmUj2AVf_XUKNwUs1SWtpF6dk"
    volumes:
      - avis_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "AaA28M7CTZQ0P0Y3d6P3tnWeqAkwRAfO"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  avis_data:
  avis_test_data:
